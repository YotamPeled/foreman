name      = "runtime-v4"
order     = 5
want      = """
What the headless proof and the first product-front preparation found wrong in the runtime: the merge desk
lands into nothing, the runtime does not know what a pool can answer, and a handful of screen and verb
truths. All origins are on /mnt/ssd/projects/foreman-scratch/ledger/findings.md and the headless front's
findings; every task names its origin.
"""
done-when = "On an isolated state directory: a desk landing fast-forwards the target under a lease and the task reads landed at a sha on the target, a request on a self-mode front is refused before the desk takes it, a pool whose vendor answered a quota refusal shows 'out until <reset>' on Capacity and refuses launches by name until then, Capacity shows each pool's vendor processes on the machine and refuses a launch that would exceed the machine-wide cap whoever started the others, a front allocation over an out pool prints as out, a headless turn's vendor process raises no intruder anomaly, every panel age is non-negative against now, `foreman attach` prints a window line only when the helper opened one, findings carry ids on the screen, a roster supervisor can file a finding on a front it does not hold, and the smoke tests reap every unit they start — all CONFIRMED by running."
land-on   = "main"
reviews   = "on request"
after     = ["headless"]
prefer    = 9

[allocation]
muse  = 0
grok  = 2
opus  = 1
astra = 1

[[task]]
title   = "the desk lands into the target"
core    = true
scope   = """
WHAT: rul-c6up3pt: `merge land` rebases the branch onto the target in the desk's own worktree, runs the
target's check there, pushes the rebased head to the TARGET ref with a lease on the sha it rebased onto
(fast-forward only, no merge commit), then pushes the branch; a target that moved during the check refuses
the push and the desk re-queues the request once before failing it back with the reason; `task landed` is
written with the target sha. `merge request` reads the front's merge mode first: a request on a self-mode
front is refused at request time, naming `task landed`, and the desk never takes it.
INPUTS: headless front findings 'merge_land_main never advances the target' and 'merge.py never reads the
front's merge mode'; merge.py; tests/v2 merge tests.
OUTPUTS: the two behaviours, tests driving a landing into a fixture target with and without a moved target.
OUT OF SCOPE: merge commits, squash, review gating.
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "the runtime knows what a pool can answer"
core    = true
scope   = """
WHAT: (a) a job that dies with a vendor quota/rate refusal naming a reset (Muse 429 'Subscription quota
exhausted ... resets at <iso>', and each pool's equivalent per its adapter's `usage`/verdict) marks the pool
out until that reset on pools.jsonl; Capacity prints 'muse: out until 2026-09-14 00:00Z (quota)'; launches
on it are refused by name until the reset passes; the backup-builder rule fires on the first death for that
cause (rul-by64rmr). (b) The collector counts each pool's vendor processes on the whole machine (argv starts
with the vendor binary; never a loose name match) and Capacity prints 'grok: 2 running on the box, cap 3';
a launch that would exceed the machine-wide cap is refused by name whoever started the others. (c) A front
allocation over an out pool prints 'out' on the front line, not 'n/m held'.
INPUTS: findings 'muse exhausted', 'pgrep -f overcounts', 'allocation over a 0-cap pool'; collector.py,
capacity.py, pools/*/observe, status.py.
OUTPUTS: pool state ledger, refusals, Capacity lines, tests with fake process tables and fake refusals.
OUT OF SCOPE: reading vendor quota dashboards.
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "screen and verb truths"
scope   = """
WHAT: a headless turn's vendor process is the session's own, never an intruder anomaly (the turn runner
records its pid like a launch); the panel measures every age against now, never observed.at, so nothing
renders negative; `foreman attach` prints its window line only when the helper exited 0 and reports the
helper's stderr otherwise; findings carry ids (fnd-…) on the ledger and the screen; `foreman finding --on
<front>` is open to any roster supervisor, tagged with who; the smoke tests stop every unit they start
(a fixture that kills on teardown) and a test run leaves no foreman-* unit behind.
INPUTS: headless front findings (turn vendor as intruder; negative ages; attach reports a window it never
opened), findings ledger (findings have no ids; supervisor cannot file on a front it preps; smoke test
left a unit running); collector.py, plugin/foreman, launch.py, progress.py, tests/conftest.py.
OUTPUTS: the six behaviours with tests; panel harness green.
OUT OF SCOPE: new panel blocks.
"""
verify  = "python -m pytest tests -q && env -u FOREMAN_SESSION bin/foreman-verify panel --loads"
size    = 1
after   = []

[[task]]
title   = "the proof"
scope   = """
WHAT: run this front's done-when on an isolated state directory with a real desk and a fixture target repo
with a remote; one CONFIRMED evidence record per clause; every friction is a finding and, if under a page,
a job here (task add).
INPUTS: the three tasks above landed on the front branch.
OUTPUTS: evidence, findings, PR against main.
OUT OF SCOPE: anything the done-when does not name.
"""
verify  = "foreman doctor && foreman status | grep -c Capacity"
size    = 1
after   = ["the desk lands into the target", "the runtime knows what a pool can answer", "screen and verb truths"]

[[rule]]
text = "Every worker through foreman launch; every progress step through the verbs; every friction with Foreman itself is a finding and, if under a page, a job on this front. Builders are Grok 4.6 high while Muse is out (owner answer inb-by6c6is governs how many)."

[[rule]]
text = "Merges into the front branch happen in a worktree or as one ready commit, never as an in-progress merge in a checkout anything runs from; a test double refuses what the real program refuses; the plan names its seams as tasks."
