name      = "skills"
order     = 3
want      = """
The five role skills of DESIGN.md §15 and the role-prompt templates of §12, written for agents: exact
verbs, exact files, exact moments; nothing a session has to guess.
"""
done-when = "A fresh Claude session given only foreman-plan produces a brief that passes `front add` on the first try; a fresh headless Opus session given only its role prompt and foreman-supervise drives a fake front through flow 2 without asking anything a ruling covers."
land-on   = "main"
reviews   = "always"
after     = ["runtime"]
prefer    = 3

[allocation]
muse  = 2
opus  = 1
astra = 1
grok  = 1

[[task]]
title   = "role prompt templates"
scope   = """
WHAT: FOREMAN-ROLE.md templates for foreman, supervisor, merge desk, and FOREMAN-JOB.md for workers, with
every injected field named; rendered by the launcher.
INPUTS: §5.2, §12.
OUTPUTS: templates/ with a rendering test per role.
OUT OF SCOPE: the skills themselves.
"""
verify  = "foreman-verify templates"
size    = 4
after   = []

[[task]]
title   = "foreman-plan"
scope   = """
WHAT: the planner's skill: the world in one page, the brief schema and validation, what a sharp scope is
(WHAT/INPUTS/OUTPUTS/OUT), what a good monitor is, the allocation roles, the interview order, when a brief
is ready, how to hand over.
INPUTS: §2, §4, §15; ~/.claude/skills/writing-for-agents.
OUTPUTS: skills/foreman-plan/SKILL.md; a transcript of a fresh session producing a passing brief.
OUT OF SCOPE: teaching architecture in general.
"""
verify  = "foreman-verify skill plan"
size    = 1
after   = ["role prompt templates"]

[[task]]
title   = "foreman-supervise and pool skills"
scope   = """
WHAT: the supervisor's skill (§3 supervisor steps, the rulebook, the job spec template, verify by re-running,
checkpoint discipline, when to ask, how to order the queue) and one pool skill per shipped pool (how to
spec for it, unit size, timeout, cannot-take, reading its output).
INPUTS: §3, §5.2, §8, §9; ~/.claude/skills/{muse-workers,grok-workers,opus-supervisor}.
OUTPUTS: skills/foreman-supervise/SKILL.md, skills/foreman-pool-{opus,muse,astra,grok}/SKILL.md; a fake
front driven through flow 2 by a session holding only these.
OUT OF SCOPE: the foreman's and merge desk's skills.
"""
verify  = "foreman-verify skill supervise"
size    = 5
after   = ["role prompt templates"]

[[task]]
title   = "foreman-orchestrate and foreman-merge"
scope   = """
WHAT: the foreman's skill (admission, routing, answering, rulings, digest, what never reaches the owner) and
the merge desk's (landing per target, the ledger line, failing back).
INPUTS: §3, §11, §14.
OUTPUTS: the two SKILL.md files; flow 3 and flow 7 driven by sessions holding only these.
OUT OF SCOPE: —
"""
verify  = "foreman-verify skill orchestrate"
size    = 2
after   = ["foreman-supervise and pool skills"]

[[monitor]]
question = "does a fresh planner session produce a passing brief first try?"
measure  = "foreman-verify skill plan --first-try"
unit     = "pass"
of       = 1
every    = "landing"

[[rule]]
text = "Skills are written per ~/.claude/skills/writing-for-agents: context pointers, exact names, completion criteria; no prose that a reader must interpret."
