name      = "runtime-v5"
order     = 7
merge     = "desk"
want      = """
The thirteen frictions the first real product front (the orbit-v2 trial, supervised by an outside session
through Foreman as it is on main) reported, all recorded under '[orbit-v2 trial]' on
/mnt/ssd/projects/foreman-scratch/ledger/findings.md. Owner authorization 2026-09-09: build them. The trial
keeps running on the installed CLI; nothing lands into the installed command until the foreman says so.
"""
done-when = "On an isolated state directory: `foreman wait <session>` blocks until the collector records the job's outcome and prints outcome, exit code, branch and head, exiting with the worker's code; `job verify --run` executes the task's verify in a fresh detached worktree of the job's head and records command, exit, duration and an output file under the session dir, and `--output-file` attaches a file to a verify or a finding; a job row on `foreman status` shows branch and head once the finish marker is read; a merge lands with `[merge.\"<repo path>\"] check` selected by the target's repository and the merge record carries the check command, exit, duration and output ref; a user pool whose manifest names a model launches with that model, and the machine-wide count exempts any pool whose executable resolves to claude; a grok launch carries the six GROK_*_ENABLED=false variables and its log shows a line within 30 s of start; `launch --kind review --branch <existing>` reviews that branch read-only; `finding --task` is accepted beside `--on`; 'unknown pool astra' hints codex; editing pool config prints the reload it needs; the job file names the marker without quoting it — all CONFIRMED by running."
land-on   = "main"
reviews   = "on request"
after     = ["runtime-v4b"]
prefer    = 9

[allocation]
muse  = 0
grok  = 2
opus  = 1
astra = 1

[[task]]
title   = "foreman wait"
core    = true
scope   = """
WHAT: `foreman wait <session|job> [--timeout]` blocks until the collector has recorded the job's outcome
(returned, returned-with-work, failed, killed, timed out), polling the job ledger (never the log), then
prints one line: outcome, exit code, branch, head, log path; exits with the worker's exit code (124 on
its own timeout). Waiting on several ids at once prints one line each as they finish. The job file stops
quoting the literal marker text (it names the marker's location and says 'a finish line'), so nothing
echoed into a log matches a waiter.
INPUTS: findings ledger frictions 10 and 13; collector.py job outcomes; launch.py FOREMAN-JOB.md
template; templates/job.md.
OUTPUTS: the verb with tests driven by a fake collector writing outcomes; the job-file change with a test
that the marker text does not appear in it.
OUT OF SCOPE: headless wakes (already exist).
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "job verify --run, output files, branch and head on the job row"
core    = true
scope   = """
WHAT: `job verify --run` creates a detached worktree of the job's head, runs the task's verify command
there, records command, exit code, duration and an output file under state/sessions/<job session>/verify/
on the job line, credits units only on exit 0, and removes the worktree; `--output-file <path>` on `job
verify` and `foreman finding` copies the file under the session dir and references it on the record;
the collector records branch and head on the job line when it reads the finish marker, and `foreman
status` prints them on the job row.
INPUTS: frictions 7, 9, 12; progress.py, collector.py, status.py.
OUTPUTS: the three behaviours with tests on a fixture repo.
OUT OF SCOPE: running verifies for jobs on other machines.
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "the desk's check per target repository, recorded on the merge"
scope   = """
WHAT: `[merge."<absolute repo path>"] check = "<cmd>"` selects the check for landings whose target lives
in that repository, `[merge] check` remains the fallback; the merge record carries the check command, exit
code, duration and an output file ref under the desk session's dir; a landing with no check for its repo
fails back naming the config key to set.
INPUTS: frictions 1 (merge) and the v4b finding 'merge record proves no check'; merge.py, config.py.
OUTPUTS: config reading with tests on two fixture repos with different checks; the recorded fields.
OUT OF SCOPE: deployment steps.
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "pools tell the truth: user-pool model, claude-family count, grok env and liveness"
scope   = """
WHAT: a user pool's manifest `model` wins over the packaged adapter's role pin (or the refusal says the
model is pinned and why); the machine-wide count exemption applies to any pool whose executable resolves
to the claude binary, not only the pool named claude; the grok pool sets GROK_CLAUDE_SKILLS_ENABLED,
GROK_CLAUDE_AGENTS_ENABLED, GROK_CLAUDE_RULES_ENABLED, GROK_CLAUDE_MCP_ENABLED, GROK_CLAUDE_HOOKS_ENABLED
and GROK_CURSOR_RULES_ENABLED to false in every launch (confirm the exact six names from the corpus
runner bin/gt_run.sh in /mnt/ssd/projects/esc-corpus, read-only); grok launches use a streaming output
format or a heartbeat so the log shows a line within 30 s; 'unknown pool astra' hints codex (gpt-6-astra);
`foreman pool list` and any verb that reads pool config print 'run foreman collector restart' when the
on-disk config is newer than the collector's start.
INPUTS: frictions 2, 3, 4, 5, 11 and the Grok-log observation; pools/claude.py ROLE_MODELS, pools/grok.py,
capacity.py, config.py.
OUTPUTS: each behaviour with a test.
OUT OF SCOPE: new pools.
"""
verify  = "python -m pytest tests -q && foreman pool list"
size    = 1
after   = []

[[task]]
title   = "review an existing branch; flag names"
scope   = """
WHAT: `launch <role> <pool> <spec> --kind review --branch <existing>` checks that branch out read-only in
the review worktree (no new branch), refusing only if it does not exist; `foreman finding --task` is
accepted as a synonym of `--on`, and `launch --on` as a synonym of `--task`, both documented in --help.
INPUTS: frictions 6 and 8; launch.py, progress.py.
OUTPUTS: the two behaviours with tests.
OUT OF SCOPE: anything else about reviews.
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "the proof"
scope   = """
WHAT: run this front's done-when on an isolated state directory with a fake worker and two fixture repos;
one CONFIRMED evidence record per clause; every friction is a finding and, if under a page, a job here.
The installed CLI is NOT reinstalled by this front; the foreman does that when the trial allows.
INPUTS: the five tasks above landed on the front branch.
OUTPUTS: evidence, findings, the landing through the desk.
OUT OF SCOPE: anything the done-when does not name.
"""
verify  = "foreman doctor && foreman status | grep -c Capacity"
size    = 1
after   = ["foreman wait", "job verify --run, output files, branch and head on the job row", "the desk's check per target repository, recorded on the merge", "pools tell the truth: user-pool model, claude-family count, grok env and liveness", "review an existing branch; flag names"]

[[rule]]
text = "Every task lands through the merge desk (headless). Builders: Grok 4.6 high, two at a time inside the machine-wide cap; Opus 5 high only when the Grok run fails; Astra 6 low reviews. Slim jobs, investigate before the spec, a done-when that names every reachable check, commit as you go."

[[rule]]
text = "The orbit-v2 trial runs on the installed CLI: nothing on this front reinstalls it or restarts the collector; the foreman does both when the trial's supervisor says it is at a safe point."
