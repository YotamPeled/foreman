name      = "runtime-v5"
order     = 7
merge     = "desk"
want      = """
The job report-back contract, owner ruling 2026-09-09: a supervisor that queued a job and moved on must be
told, not have to look, when it finishes, and must find the worker's own claims in one place. Two pieces:
wakes pushed to windowed sessions, and a structured result file per job. Plus the merge desk's check
command per target repository, and merge requests refused when the desk cannot turn.
"""
done-when = "On an isolated state directory: a job launched by a windowed Claude supervisor returns and, within one tick, that session receives one cross-session message naming the job id, task, outcome and the result file path, and the event reads delivered once; a worker template instructs the worker to write RESULT.md at its worktree root (what changed, how it verified itself, what it did not do, what it is unsure of, the finish marker as the last line) and `job verify` prints that file's four sections and refuses a returned job whose RESULT.md is missing or has no marker unless --because is given; `[merge.\"<repo path>\"] check` selects the check by the target's repository with `[merge] check` as the fallback, proven by two fixture repos with different checks; a merge request whose front's desk is windowed is refused at the door naming the desk and the fix; `foreman status` prints 'N wakes queued, undeliverable (windowed)' on any such session — all CONFIRMED by running."
land-on   = "main"
reviews   = "on request"
after     = ["runtime-v4b"]
prefer    = 8

[allocation]
muse  = 0
grok  = 2
opus  = 1
astra = 1

[[task]]
title   = "wakes reach windowed sessions"
core    = true
scope   = """
WHAT: when the collector has a queued wake for a session that is windowed (headless false) and a Claude
vendor, it delivers the wake as one cross-session message to that session's socket (the same channel
supervisors use to message each other; find how the session's socket is discovered from its pid under
/run/user/<uid>/cc-socks/ and reuse it), marks the event delivered, and never delivers twice; a session
with no reachable socket keeps the event queued and status prints 'N wakes queued, undeliverable' on its
line. Message text = the same event text a headless turn would receive.
INPUTS: collector.py wake queue (events.jsonl, delivered_at), the turn runner's event text, procs.py;
finding 'windowed desk accumulates wakes'.
OUTPUTS: the delivery path with a fake socket in tests; the status line; a test that a delivered event is
never delivered again.
OUT OF SCOPE: Codex/Muse/Grok sessions (no socket).
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "RESULT.md is the worker's report"
core    = true
scope   = """
WHAT: every worker template (job.md and the per-pool implement/review templates) tells the worker to write
RESULT.md at the worktree root before it ends, with exactly four headed sections — What changed; How I
verified it (commands run and their last line); What I did not do; What I am unsure of — and the finish
marker as the file's last line; the collector reads the marker from RESULT.md first and the log second;
`job verify` prints the four sections before it credits units and refuses a returned job with no RESULT.md
or no marker unless --because is given; `foreman status` shows 'result: written' or 'result: missing' on a
returned job's line.
INPUTS: templates/*.md, launch.py marker handling, collector.py, progress.py job verify; the muse-workers
skill's completion-marker convention.
OUTPUTS: templates, verb changes, tests with a fake worktree holding each malformed shape.
OUT OF SCOPE: parsing the sections beyond their presence.
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "the desk's check per target repository and refusal at the door"
scope   = """
WHAT: `[merge."<absolute repo path>"] check = "<cmd>"` selects the check for landings whose target lives
in that repository, `[merge] check` remains the fallback, and the desk names which one it ran on the merge
record; `merge request` is refused when the front's desk session is windowed (headless false), naming the
desk and 'relaunch it headless'.
INPUTS: merge.py merge_check_command, config.py, launch.py desk shape; findings 'check is global' and
'windowed desk never turns'.
OUTPUTS: config reading with tests on two fixture repos, the refusal with a test.
OUT OF SCOPE: per-branch checks.
"""
verify  = "python -m pytest tests -q"
size    = 1
after   = []

[[task]]
title   = "the proof"
scope   = """
WHAT: run this front's done-when on an isolated state directory with a real windowed Claude session as the
supervisor (so the socket delivery is real) and a fake worker; one CONFIRMED evidence record per clause;
every friction is a finding and, if under a page, a job here.
INPUTS: the three tasks above landed on the front branch.
OUTPUTS: evidence, findings, the landing through the desk.
OUT OF SCOPE: anything the done-when does not name.
"""
verify  = "foreman doctor && foreman status | grep -c Capacity"
size    = 1
after   = ["wakes reach windowed sessions", "RESULT.md is the worker's report", "the desk's check per target repository and refusal at the door"]

[[rule]]
text = "Every task lands through the merge desk (headless). Builders: Grok 4.6 high; Opus 5 high only when the Grok run fails; Astra 6 low reviews. Slim jobs, investigate before the spec, a done-when that names every reachable check."
